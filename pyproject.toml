[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-bot"
version = "0.1.0"
description = "Production-grade modular cryptocurrency trading bot"
requires-python = ">=3.11"
dependencies = [
  "ccxt>=4.3.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.1",
  "SQLAlchemy>=2.0.0",
  "requests>=2.32.0",
  "psycopg2-binary>=2.9.9",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "optuna>=3.6.0",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["crypto_bot*"]

[tool.setuptools.package-data]
"crypto_bot.web" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
